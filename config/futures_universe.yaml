# Futures universe for the replication. Fixed BEFORE any strategy result was
# computed on futures. Yahoo Finance continuous front-month series ("=F"): unadjusted, so
# roll handling is part of the work. rolls_per_year = number of contract months in the
# exchange's standard cycle (used to cross-check the roll detector, see src/futures.py).
# RTY=F is excluded: Yahoo's history starts only in 2017.
- {ticker: ES=F, name: E-mini S&P 500,        group: equity,    rolls_per_year: 4}
- {ticker: NQ=F, name: E-mini Nasdaq-100,     group: equity,    rolls_per_year: 4}
- {ticker: YM=F, name: E-mini Dow,            group: equity,    rolls_per_year: 4}
- {ticker: ZT=F, name: 2-year Treasury note,  group: rates,     rolls_per_year: 4}
- {ticker: ZF=F, name: 5-year Treasury note,  group: rates,     rolls_per_year: 4}
- {ticker: ZN=F, name: 10-year Treasury note, group: rates,     rolls_per_year: 4}
- {ticker: ZB=F, name: 30-year Treasury bond, group: rates,     rolls_per_year: 4}
- {ticker: CL=F, name: WTI crude oil,         group: energy,    rolls_per_year: 12}
